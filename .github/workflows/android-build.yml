name: Build Android APK

# Builds installable debug + release APKs for Neon Calculator 2 and verifies
# that the packaged app carries no network or tracking permissions.
on:
  push:
    branches: [main]
    # Docs-only changes should not mint a new signing key or a new artifact set.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'store/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Android SDK
        # Find the SDK on the runner, or lay down Google's command-line tools if
        # the image no longer provides them, then install exactly the platform
        # and build-tools this app compiles against.
        # (android-actions/setup-android@v3 is no longer usable: it asks
        # sdkmanager for the retired "tools" package and fails.)
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$d" ] && [ -d "$d" ]; then echo "existing SDK dir: $d"; ls "$d" || true; fi
          done
          SDK=""
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
            if [ -n "$d" ] && [ -d "$d" ]; then SDK="$d"; break; fi
          done
          if [ -z "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          mkdir -p "$SDK"
          SDKMGR=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1 || true)
          if [ -z "$SDKMGR" ]; then
            echo 'sdkmanager not found - installing Android command-line tools'
            mkdir -p "$SDK/cmdline-tools"
            for url in \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip ; do
              echo "trying $url"
              if curl -fsSL -o /tmp/cmdtools.zip "$url"; then break; fi
            done
            rm -rf "$SDK/cmdline-tools/latest" /tmp/cmdtools-unpack
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools-unpack
            mv /tmp/cmdtools-unpack/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMGR=$(find "$SDK" -name sdkmanager -type f | head -1)
          fi
          echo "Using SDK: $SDK"
          echo "Using sdkmanager: $SDKMGR"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export JAVA_HOME="${JAVA_HOME:-}"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo '--- installed platforms ---'
          ls "$SDK/platforms"
          echo '--- installed build-tools ---'
          ls "$SDK/build-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run web smoke tests
        run: npm test

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Prepare signing key
        id: keystore
        env:
          USER_KEYSTORE_B64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
          USER_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          USER_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ks"
          KS="$RUNNER_TEMP/ks/neoncalculator2.jks"
          if [ -n "${USER_KEYSTORE_B64:-}" ]; then
            # Production path: reuse the upload key supplied through repository secrets.
            printf '%s' "$USER_KEYSTORE_B64" | base64 -d > "$KS"
            PASS="${USER_KEYSTORE_PASSWORD:?NEON_KEYSTORE_PASSWORD secret is required when NEON_KEYSTORE_BASE64 is set}"
            ALIAS="${USER_KEY_ALIAS:-neoncalculator2}"
            MODE="provided"
          else
            # Fallback: mint a throwaway key so the release APK installs out of the box.
            PASS=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
            ALIAS="neoncalculator2"
            MODE="generated"
            keytool -genkeypair -v \
              -keystore "$KS" -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -alias "$ALIAS" \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Neon Calculator 2, OU=Mobile, O=Neon Calculator 2, L=Bengaluru, S=Karnataka, C=IN"
            INFO="$RUNNER_TEMP/ks/keystore-info.txt"
            {
              echo 'Neon Calculator 2 - release signing key'
              echo '======================================='
              echo 'Generated automatically by the GitHub Actions workflow.'
              echo
              echo 'keystore file : neoncalculator2.jks'
              echo "key alias     : $ALIAS"
              echo "store/key pass: $PASS"
              echo 'validity      : 30 years (10950 days), RSA 2048'
              echo
              echo 'Keep this file: reusing the same key lets you ship updates that'
              echo 'install over an existing copy of the app. To have CI reuse it on'
              echo 'future runs, add these repository secrets (Settings -> Secrets and'
              echo 'variables -> Actions):'
              echo
              echo '  NEON_KEYSTORE_BASE64   = base64 -w0 neoncalculator2.jks'
              echo '  NEON_KEYSTORE_PASSWORD = the password above'
              echo "  NEON_KEY_ALIAS         = $ALIAS"
            } > "$INFO"
          fi
          echo "::add-mask::$PASS"
          echo "pass=$PASS"   >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"   >> "$GITHUB_OUTPUT"
          echo "Signing mode: $MODE"

      - name: Build debug + release APKs
        env:
          NEON_KEYSTORE_PATH: ${{ runner.temp }}/ks/neoncalculator2.jks
          NEON_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.pass }}
          NEON_KEY_PASSWORD: ${{ steps.keystore.outputs.pass }}
          NEON_KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: apks
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle | head -1)
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/NeonCalculator2-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/NeonCalculator2-${VERSION}-release.apk"
          ls -lh dist
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify the packaged APK
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          APK="dist/NeonCalculator2-${{ steps.apks.outputs.version }}-release.apk"
          echo "=== badging ==="
          "$BT/aapt" dump badging "$APK" | grep -E "package:|application-label:|sdkVersion|targetSdkVersion|launchable-activity" || true
          echo "=== declared permissions ==="
          PERMS=$("$BT/aapt" dump permissions "$APK" | grep "uses-permission" || true)
          echo "${PERMS:-<none>}"
          if echo "$PERMS" | grep -qE "INTERNET|ACCESS_NETWORK_STATE|AD_ID|ACCESS_FINE_LOCATION|CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE"; then
            echo "::error::Forbidden permission found in APK"; exit 1
          fi
          echo "=== signature ==="
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -20
          echo "=== contents (sanity) ==="
          unzip -l "$APK" | grep -E "assets/public/index.html|mipmap-xxxhdpi/ic_launcher.png|resources.arsc" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonCalculator2-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonCalculator2-release-apk
          path: dist/*-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signing key for future updates
        uses: actions/upload-artifact@v4
        with:
          name: neoncalculator2-signing-key
          path: ${{ runner.temp }}/ks/
          if-no-files-found: warn
          retention-days: 90
